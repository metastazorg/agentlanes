name: test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        python: ["3.10", "3.12"]
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Doctor
        run: agentlanes doctor || true
      - name: Demo
        run: bash demo.sh
  macos:
    # The second macos-latest job of a run was left unassigned for 15 minutes three times
    # ("The job was not acquired by Runner"), even one at a time; spread over two pinned images instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, python: "3.10"}
          - {os: macos-15, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Doctor
        run: agentlanes doctor || true
      - name: Demo
        run: bash demo.sh
