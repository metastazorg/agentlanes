name: macos
# Separate from "test" (Linux) on purpose: on 11-24 GitHub's hosted macOS pool left most macOS jobs on this
# account unassigned for 15 minutes ("The job was not acquired by Runner") and cancelled them, which turned the
# test badge red for reasons unrelated to the code. Successful macOS runs: 11-24 (3.10 and 3.12 on macos-latest/15).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
jobs:
  macos:
    strategy:
      matrix:
        include:
          - {os: macos-15, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Doctor
        run: agentlanes doctor || true
      - name: Demo
        run: bash demo.sh
