[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlanes-cli"                  # PyPI name ("agentlanes" is too close to an existing project); command and import stay agentlanes
version = "0.3.5"
description = "Run several AI coding agents (Claude Code, Codex, Cursor) on one machine without collisions: file claims, a git worktree per agent, memory-capped slots, an MCP server, Landlock write lanes"
keywords = ["ai-agents", "coding-agents", "claude-code", "codex", "cursor", "mcp", "mcp-server", "multi-agent", "git-worktree", "landlock", "file-locking", "developer-tools"]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Metastaz" }]
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/metastazorg/agentlanes"
Issues = "https://github.com/metastazorg/agentlanes/issues"
Changelog = "https://github.com/metastazorg/agentlanes/blob/main/CHANGELOG.md"

[project.scripts]
agentlanes = "agentlanes.cli:entry"        # rename: left side is the command name

[tool.setuptools.packages.find]
where = ["src"]
